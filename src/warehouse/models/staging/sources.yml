version: 2

sources:
  - name: ga4_raw
    description: "GA4 event data from BigQuery Public Dataset or raw tables ingested via Dataflow"
    database: "{{ env_var('BQ_RAW_PROJECT', 'bigquery-public-data') }}"
    schema: "{{ env_var('BQ_RAW_DATASET', 'ga4_obfuscated_sample_ecommerce') }}"
    # Wildcard table events_*: BigQuery requires a wildcard table name inside
    # backticks (`events_*`), so the identifier must stay quoted for _TABLE_SUFFIX
    quoting:
      identifier: true
    tables:
      - name: events
        identifier: "{{ env_var('BQ_RAW_TABLE', 'events_*') }}"