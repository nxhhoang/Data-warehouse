name: Python tests & pipeline simulation

# ==========================================================================
# Runs the unit tests (tests/) and the full local simulation chain
# (scripts/run_simulation.sh) on every branch. Level 0 of the testing
# strategy in docs/runbook.md: no GCP account, no billing, no secrets —
# the pipeline reads the JSONL fixture and writes local JSONL files.
# Only the packages the tests actually need are installed to keep the job
# fast; the full dependency set lives in requirements.txt.
# ==========================================================================

on:
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "config/**"
      - "conftest.py"
      - "requirements.txt"
      - ".github/workflows/ci-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "config/**"
      - "conftest.py"
      - "requirements.txt"
      - ".github/workflows/ci-tests.yml"
  workflow_dispatch:

# Cancel in-progress runs of the same branch on new pushes
concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "apache-beam[gcp]" google-cloud-bigquery google-cloud-pubsub pyyaml pytest

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Run pipeline simulation chain
        run: bash scripts/run_simulation.sh

      - name: Upload simulation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-dry-run-${{ github.run_number }}
          path: |
            build/pipeline_dry_run/
            data/quality_log/
          if-no-files-found: warn
          retention-days: 7
