name: Python tests & pipeline simulation

# ==========================================================================
# Runs the unit tests (tests/) and the full local simulation chain
# (scripts/run_simulation.sh) on every branch. Level 0 of the testing
# strategy in docs/runbook.md: no GCP account, no billing, no secrets —
# the pipeline reads the JSONL fixture and writes local JSONL files.
# Install all project requirements so dashboard, publisher and warehouse helper
# tests use the same dependency set as local development. No cloud calls run here.
# ==========================================================================

on:
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "config/**"
      - "conftest.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose*.yml"
      - ".github/workflows/ci-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "config/**"
      - "conftest.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose*.yml"
      - ".github/workflows/ci-tests.yml"
  workflow_dispatch:

# Cancel in-progress runs of the same branch on new pushes
concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DASHBOARD_DATA_SOURCE: mock
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit, replay-safety, and report KPI formula tests (offline)
        # Includes direct execution of the three KPI view SQL files with SQLite.
        run: pytest tests/ -v

      - name: Check bounded benchmark CLI (no BigQuery calls)
        run: python tests/benchmark_kpi.py --help

      - name: Run pipeline simulation chain
        run: bash scripts/run_simulation.sh

      - name: Upload simulation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-dry-run-${{ github.run_number }}
          path: |
            build/pipeline_dry_run/
            data/quality_log/
          if-no-files-found: warn
          retention-days: 7

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: local-project
      DASHBOARD_DATA_SOURCE: mock
      PUBLISH_RATE_PER_SEC: 0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build replay image
        timeout-minutes: 12
        run: docker build --load --shm-size=64m -t ga4-replay:latest .

      - name: Run offline Publisher -> Emulator -> DirectRunner
        timeout-minutes: 6
        run: docker compose run --rm --no-deps replay

      - name: Upload offline replay outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-replay-${{ github.run_number }}
          path: build/emulator_replay/output/
          if-no-files-found: warn
          retention-days: 7

      - name: Remove Compose resources
        if: always()
        run: docker compose down --remove-orphans || true
