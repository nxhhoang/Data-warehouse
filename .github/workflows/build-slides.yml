name: Build LaTeX slides

# Kích hoạt khi:
#  - push thay đổi trong thư mục slide/ hoặc chính workflow này
#  - chạy thủ công từ tab Actions trên GitHub
on:
  push:
    branches: [main, master]
    paths:
      - 'slide/**'
      - '.github/workflows/build-slides.yml'
  pull_request:
    paths:
      - 'slide/**'
      - '.github/workflows/build-slides.yml'
  workflow_dispatch:

# Hủy job cũ đang chạy của cùng branch khi push mới
concurrency:
  group: latex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          # Thư mục chứa main.tex
          working_directory: slide
          # File gốc cần biên dịch
          root_file: main.tex
          # latexmk tự chạy đủ số pass để mục lục/TOC hội tụ
          # args mặc định: -pdf -file-line-error -interaction=nonstopmode -halt-on-error

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: slides-pdf
          path: slide/main.pdf
          if-no-files-found: error
