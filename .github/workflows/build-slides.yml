name: Build LaTeX slides

# Triggers:
#  - push with changes under slide/ or this workflow itself
#  - manual runs from the GitHub Actions tab
on:
  push:
    branches: [main, master]
    paths:
      - 'slide/**'
      - '.github/workflows/build-slides.yml'
  pull_request:
    paths:
      - 'slide/**'
      - '.github/workflows/build-slides.yml'
  workflow_dispatch:

# Cancel in-progress runs of the same branch on new pushes
concurrency:
  group: latex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          # Folder holding main.tex
          working_directory: slide
          # Root file to compile
          root_file: main.tex
          # latexmk reruns enough passes for the TOC to converge;
          # default args: -pdf -file-line-error -interaction=nonstopmode -halt-on-error

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: slides-pdf
          path: slide/main.pdf
          if-no-files-found: error
