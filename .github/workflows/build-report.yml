name: Build LaTeX report

# ==========================================================================
# Workflow that compiles the LaTeX report (report/) into a PDF on GitHub.
# Every step below is annotated for easy review; the workflow NEVER runs
# locally — all setup and compilation happens on GitHub Actions.
# ==========================================================================

# --- Triggers -------------------------------------------------------------
# on.push   : runs automatically on pushes to main/master, but ONLY when
#             files under report/ or this workflow itself change
#             (saves CI minutes when editing files outside the report).
# on.pull_request: same paths, runs as a check on pull requests.
# on.workflow_dispatch: allows manual runs from the GitHub Actions tab.
on:
  push:
    branches: [main, master]
    paths:
      - 'report/**'
      - '.github/workflows/build-report.yml'
  pull_request:
    paths:
      - 'report/**'
      - '.github/workflows/build-report.yml'
  workflow_dispatch:

# --- Cancel stale runs ----------------------------------------------------
# concurrency: on rapid successive pushes, keep only the latest run per
# branch (github.ref) and cancel in-progress ones to save resources.
concurrency:
  group: report-latex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Free Ubuntu VM provided by GitHub (ubuntu-latest = 24.04).
    runs-on: ubuntu-latest

    steps:
      # Step 1: check out the repository into $GITHUB_WORKSPACE.
      # actions/checkout@v4 is the current major version.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: compile LaTeX using the full TeXLive Docker image.
      # xu-cheng/latex-action@v3:
      #   - runs inside the texlive-full container (ships pdflatex, latexmk,
      #     biber, vntex for Vietnamese, tikz, algorithm2e, glossaries-extra, ...);
      #   - latexmk defaults:
      #       -pdf                          -> produce a PDF (uses pdflatex)
      #       -file-line-error              -> errors shown as file:line:column
      #       -interaction=nonstopmode      -> never stop and wait for input on errors
      #       -halt-on-error                -> stop at the first error -> job fails
      #   - latexmk reruns ENOUGH passes for the table of contents and lists
      #     of figures/tables to converge, and calls BIBER itself because
      #     main.tex uses biblatex (\addbibresource);
      #   - working_directory: report keeps relative paths (text/, image/)
      #     resolving exactly like a local build inside report/.
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: report   # folder holding main.tex
          root_file: main.tex         # root file to compile

      # Step 3: upload the resulting PDF as an artifact downloadable from the
      # Actions tab. if-no-files-found: error -> if the build produced no
      # main.pdf the job fails immediately (catches silent failures early).
      # Artifact retention follows the repository default (usually 90 days).
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: report-pdf            # artifact name shown on GitHub
          path: report/main.pdf       # build output file
          if-no-files-found: error
