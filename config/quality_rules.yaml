# =====================================================================
# Data quality rules — shared by the pipeline (Layer 3) and dbt tests
# (Layer 4). Every violation is logged to data/quality_log/
# (milestone M3 deliverable, report section 3.2.3).
# =====================================================================
version: 1

# Placeholder / missing values to normalize
placeholder_values: ["<Other>", "(data deleted)", "(not set)", ""]
null_like: [null, ""]

# Duplicate event detection
duplicate_check:
  # event_id = hash of these fields (see report/text/thiet-ke-mo-hinh-chieu.tex)
  event_key_fields:
    - user_pseudo_id
    - event_timestamp
    - event_name
    - event_bundle_sequence_id

# Invalid record handling
invalid_records:
  missing_session_id:
    action: use_unknown_dimension        # "Unknown" dim member, key -1
  purchase_without_transaction_id:
    action: drop_and_log
  negative_or_zero_revenue:
    action: drop_and_log

# Data quality log
quality_log:
  path: data/quality_log/
  fields: [run_date, rule_name, table, affected_rows, action]
