# =====================================================================
# source/medium -> channel grouping rules.
# SINGLE SOURCE OF TRUTH: extract, pipeline, dbt and dashboard all read
# from this file so the layers never drift apart.
# Phase 1 deliverable — locked before 2026-10-30 (report section 4.2).
# =====================================================================
version: 1

# Values treated as "Unknown" (stored in the "Unknown" dim member, key -1)
unassigned:
  sources: ["(direct)", "(not set)", "(none)", "<Other>", "(data deleted)"]
  mediums: ["(not set)", "(none)", "<Other>", "(data deleted)"]

# Rules are applied IN ORDER; the first match wins
rules:
  - channel: direct
    source: ["(direct)"]
    medium: ["(none)"]

  - channel: organic_search
    medium: ["organic"]

  - channel: paid_search
    source: ["google"]
    medium: ["cpc", "ppc"]

  - channel: display
    medium: ["display", "cpm"]

  - channel: email
    medium: ["email"]

  - channel: affiliate
    medium: ["affiliate"]

  - channel: paid_social
    medium: ["paid-social", "paidsocial"]

  # TODO(G1): split social_organic and referral by explicit source lists
  # after surveying the actual distribution of the dataset
  - channel: social_organic
    medium: ["social", "social-network", "social-media"]

  - channel: referral
    medium: ["referral"]

# Default channel when no rule matches
default_channel: unassigned
